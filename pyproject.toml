[project]
name = "islr"
version = "0.1.0"
description = "Isolated sign language recognition (250 ASL signs) from MediaPipe landmarks: signer-independent validation, a Conv1D + Transformer model with preprocessing inside the ONNX graph, a FastAPI service and a live in-browser webcam demo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Fares Ayman" }]
# Core = what the prediction API needs at serving time (ONNX Runtime, no PyTorch).
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
train = [
    "torch>=2.5",
    "pandas>=2.2",
    "mlflow>=3.0",
    "onnx>=1.17",
    "onnxscript>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
    "kaggle>=1.6",
    "truststore>=0.10",
]

# CUDA build on the Windows training machine, small CPU build on Linux (CI)
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/islr"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
ignore = ["PD010", "PD011", "PD101", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=islr --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
